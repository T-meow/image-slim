name: Quality checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust 1.96
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy,rustfmt

      - name: Install frontend dependencies
        run: npm ci

      - name: Check generated IPC bindings
        run: npm run ipc:check

      - name: Check project protection configuration
        run: npm run config:check

      - name: Check release staging configuration
        run: npm run release:check

      - name: Check application versions
        run: npm run version:check

      - name: Check frontend
        run: npm run check

      - name: Test frontend
        run: npm test

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Lint Rust
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test Rust
        working-directory: src-tauri
        run: cargo test --locked

      - name: Check Rust targets
        working-directory: src-tauri
        run: cargo check --all-targets --locked

  build-smoke:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    needs: quality
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust 1.96
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri executable
        run: npm run tauri:build:no-bundle
