name: Quality checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust 1.96
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy,rustfmt

      - name: Install frontend dependencies
        run: npm ci

      - name: Check generated IPC bindings
        run: npm run ipc:check

      - name: Check project protection configuration
        run: npm run config:check

      - name: Check release staging configuration
        run: npm run release:check

      - name: Check generated third-party licenses
        run: |
          npm run licenses
          git diff --exit-code -- THIRD_PARTY_LICENSES.txt

      - name: Check application versions
        run: npm run version:check

      - name: Check frontend
        run: npm run check

      - name: Test frontend
        run: npm test

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Lint Rust
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test Rust
        working-directory: src-tauri
        run: cargo test --workspace --locked

      - name: Check Rust targets
        working-directory: src-tauri
        run: cargo check --workspace --all-targets --locked

  build-smoke:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    needs: quality
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust 1.96
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri executable
        run: npm run tauri:build:no-bundle

      - name: Smoke test Agent CLI
        shell: pwsh
        run: |
          $agent = 'src-tauri/target/release/image-slim-agent.exe'
          if (-not (Test-Path -LiteralPath $agent)) { throw "Missing $agent" }
          $result = & $agent capabilities --json | ConvertFrom-Json
          if (-not $result.ok -or $result.result.agent_protocol_version -ne 1) {
            throw 'Agent capabilities response is invalid'
          }
