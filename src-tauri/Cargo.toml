[package]
name = "image-slim"
version = "0.1.0"
description = "Offline image compression for Windows"
authors = ["image-slim contributors"]
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-or-later"

[lib]
name = "image_slim_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "image-slim"
path = "src/main.rs"

[workspace]
members = ["crates/image-slim-agent", "crates/image-slim-core"]
resolver = "3"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
image-slim-core = { path = "crates/image-slim-core" }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
ts-rs = { version = "=12.0.1", features = ["serde-compat"] }

[profile.release]
strip = "symbols"
lto = true
codegen-units = 1
panic = "unwind"
opt-level = 3
