[package]
name = "image-slim-agent"
version = "0.1.0"
description = "Local JSON CLI and MCP server for image-slim"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6.3", features = ["derive"] }
image-slim-core = { path = "../image-slim-core" }
rmcp = { version = "=2.2.0", default-features = false, features = ["server", "macros", "schemars", "transport-io"] }
schemars = "1.2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["io-std", "macros", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
filetime = "0.2"
png = "0.18.1"
tempfile = "3"
